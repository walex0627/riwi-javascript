<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/style.css">
    <title>Document</title>
</head>

<body>
    <div class="w-full flex align-center justify-center items-center">

        <form class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4" id="form" onsubmit="makeProduct(event)">
            <div class="mb-4">
                <label for="product" class="block text-gray-700 text-sm font-bold mb-2">Product</label>
                <input type="text" name="product" id="product" placeholder="Product" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                <label for="quantity" class="block text-gray-700 text-sm font-bold mb-2">Quantity</label>
                <input type="number" id="quantity" name="quantity" min="0" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                <label for="price" class="block text-gray-700 text-sm font-bold mb-2">Price</label>
                <input type="number" id="price" name="price" min="1" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"></textarea>
            </div>
            <br> <br>
            <button type="submit" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Add product</button>
            <div id="editModal"
                style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#fff; padding:20px; border:2px solid #333; box-shadow:0 0 10px #000;z-index:1000; border-radius: 10px;">
                <h3>Edit Product</h3>
                <label for="editProduct" class="block text-gray-700 text-sm font-bold mb-2">Product</label>
                <input type="text" id="editProduct" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"><br><br>
                <label for="editQuantity" class="block text-gray-700 text-sm font-bold mb-2">Quantity</label>
                <input type="number" id="editQuantity" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"><br><br>
                <label for="editPrice" class="block text-gray-700 text-sm font-bold mb-2">Price</label>
                <input type="number" id="editPrice" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"><br><br>
                <button id="saveChangesBtn" class="focus:outline-none text-white bg-green-700 hover:bg-green-800 focus:ring-4 focus:ring-green-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800">Save Changes</button>
            </div>
        </form>
    </div>
    <div class="w-full flex align-center justify-center items-center" >
        <table id="table-tasks" class="w-3xl text-sm text-left content-center justify-items-center" >
            <thead class="text-xs text-gray-900 uppercase bg-blue-400 ">
                <tr>
                    <th scope="col" class="px-6 py-3">Product</th>
                    <th scope="col" class="px-6 py-3">Quantity</th>
                    <th scope="col" class="px-6 py-3">Price</th>
                    <th scope="col" class="px-6 py-3">Actions</th>
                </tr>
            </thead>
            <tbody id="body-table">
            </tbody>
        </table>
    </div>


    <script type="module" src="./src/gestion_api.js"></script>
</body>

</html>
