<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>
</head>

<body>
    <form id="form" onsubmit="makeProduct(event)">
        <label for="product">Product</label>
        <input type="text" name="product" id="product" placeholder="Product" required>
        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" name="quantity" min="0">
        <label for="price">Price</label>
        <input type="number" id="price" name="price" min="1"></textarea>
        <br> <br>
        <button type="submit">Add product</button>
        <div id="editModal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#fff; padding:20px; border:2px solid #333; box-shadow:0 0 10px #000;z-index:1000;">
            <h3>Edit Product</h3>
            <label for="editProduct">Product:</label>
            <input type="text" id="editProduct"><br><br>
            <label for="editQuantity">Quantity:</label>
            <input type="number" id="editQuantity"><br><br>
            <label for="editPrice">Price:</label>
            <input type="number" id="editPrice"><br><br>
            <button id="saveChangesBtn">Save Changes</button>
            <button onclick="closeModal()">Cancel</button>
        </div>
    </form>
    <table id="table-tasks">
        <thead>
            <tr>
                <th>Product</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="body-table">
        </tbody>
    </table>
    <script src="./script.js"></script>
</body>

</html>
